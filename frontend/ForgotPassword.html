<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar contraseña</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/inscripciones.css">
</head>
<body>

  <main class="formulario" style="max-width: 400px; margin: 80px auto;">

        <div class="campo">

    </fieldset>
    <button type="button" id="btnEnviar" class="btn-matricular">Enviar link</button>
    <p id="mensaje" style="margin-top: 12px;"></p>
</main>
<script type="module" src="js/forgot-password.js"></script>

</body>
</html>
