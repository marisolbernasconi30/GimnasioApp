<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripciones</title>
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/inscripciones.css">
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

<main class="contenedor-inscripciones">
   <h1 id="tituloInscripciones">Inscripciones</h1>


   <div class="botones-estado">

    <button id="btnVencidas">
        Vencidas
    </button>

    <button id="btnPorVencer">
        Por vencer
    </button>

    <button id="btnAlDia">
        Al día
    </button>

</div>
<div class="filtros-inscripciones">

    <button id="btnActivas">
        Activas
    </button>

    <button id="btnInactivas">
        Inactivas
    </button>

</div>


        <!-- Tabla -->

<div class="tabla-contenedor">

    <table id="tablaInscripciones">
        <thead>
            <tr>
            <th>Nombre</th>
            <th>Apellido</th>
            <th>DNI</th>
            <th>Entrenamiento</th>
            <th>Inicio</th>
            <th>Vencimiento</th>
            <th>Estado</th>
            <th>Pago</th>
            </tr>
        </thead>
        <tbody id="cuerpoTablaInscripciones">
        </tbody>

    </table>

</div>

 <!-- Paginación -->
        <div class="paginacion">

            <button id="anterior" type="button">
                Anterior
            </button>

            <span id="paginaActual">
                Página 1
            </span>

            <button id="siguiente" type="button">
                Siguiente
            </button>

        </div>

    </main>

  <!-- Navbar -->
<script type="module" src="js/navbar-loader.js"></script>

  <!-- JavaScript -->
  <script  type="module" src="js/config.js"></script>
  <script  type="module" src="js/inscripciones.js"></script>
</body>
</html>
