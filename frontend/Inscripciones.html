<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripciones</title>
<link rel="stylesheet" href="./css/global.css">
<link rel="stylesheet" href="./css/inscripciones.css">
</head>
<body>
  
   

  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>
<main class="contenedor-inscripciones">
   <h1 id="tituloInscripciones">Inscripciones</h1>


        <!-- Tabla -->

<div class="tabla-contenedor">

    <table id="tablaInscripciones">
        <thead>
            <tr>
                <th>Estado</th>
                <th>Tipo de Entrenamiento</th>
                <th>Cliente ID</th>
                <th>Fecha de Inicio</th>
                <th>Fecha de Baja</th>
            </tr>
        </thead>
        <tbody id="cuerpoTablaInscripciones">
        </tbody>

    </table>

</div>

 <!-- Paginación -->
        <div class="paginacion">

            <button id="anterior" type="button">
                Anterior
            </button>

            <span id="paginaActual">
                Página 1
            </span>

            <button id="siguiente" type="button">
                Siguiente
            </button>

        </div>

    </main>

  <!-- Navbar -->
  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>

  <!-- JavaScript -->
  <script  type="module" src="js/config.js"></script>
  <script  type="module" src="js/inscripciones.js"></script>
</body>
</html>
