<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inscripciones</title>
<link rel="stylesheet" href="css/global.css">
<link rel="stylesheet" href="css/inscripciones.css">
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

  <h1>Inscripciones</h1>
  <p>Texto de ejemplo...</p>

        <!-- Tabla -->

<div class="tabla-contenedor" id="contenedorTabla">

    <table id="tablaInscripciones">
        <thead>
            <tr>
                <th>Estado</th>
                <th>Tipo de Entrenamiento</th>
                <th>cliente_id</th>
                <th>fecha_inicio</th>
                <th>fecha_baja</th>
            </tr>
        </thead>
        <tbody id="cuerpoTablaInscripciones">
        </tbody>

    </table>
<button id="anterior">Anterior</button>
<button id="siguiente">Siguiente</button>
</div>

  <!-- Navbar -->
  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>

  <!-- JavaScript -->
  <script src="js/config.js"></script>
  <script src="js/inscripciones.js"></script>
</body>
</html>
