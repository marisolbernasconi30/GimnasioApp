<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seguimiento de usuarios</title>

</head>


<body>

      <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

    <!-- =========================
         FORMULARIO
         ========================= -->

    <main class="formulario">

        <h1>Seguimiento de usuarios:</h1>

        
<ul>
      <li><a href="MatricularUsuario.html">Crear usuario</a></li>
      <li><a href="ActualizarUsuario.html">Actualizar</a></li>
      <li>
        <a href="#">Listado de usuarios registrados</a>
        <ul>
          <li><a href="ClientesActivos.html">Clientes activos</a></li> <!-- ver como programar esto-->
          <li><a href="ClientesInactivos.html">Clientes inactivos</a></li>  <!-- ver como programar esto-->
        </ul>
      </li>
      <li><a href="DarDeBaja.html">Dar de baja</a></li>
 </ul>


 <!-- Buscador -->

        <div class="buscador">

            <label for="nombreUsuario">
                Ingrese DNI del cliente
            </label>

            <input
                type="number"
                id="dniUsuario"
                placeholder="DNI del cliente"
            >

        </div>


        <!-- Tabla -->

<div class="tabla-contenedor" id="contenedorTabla">

    <table>

        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Matrícula</th>
                <th>Inscripciones</th>
                <th>Estado</th>
                <th>Último pago</th>
            </tr>
        </thead>

        <tbody id="cuerpoTabla">
        </tbody>

    </table>

</div>


    </main>


    


    <script>

        const buscador = document.getElementById("dniUsuario");

        buscador.addEventListener("keydown", function(event) {

            // Verificamos si presionó ENTER
            if (event.key === "Enter") {

                buscarUsuario();

            }

        });


async function buscarUsuario() {

    const nombre = buscador.value.trim();

    if (nombre === "") {
        return;
    }

    try {

        const respuesta = await fetch(
            "http://localhost:8080/usuarios/buscar?nombre="
            + encodeURIComponent(nombre)
        );

        const usuario = await respuesta.json();

        mostrarUsuario(usuario);

    } catch (error) {

        console.error(error);

        alert("No se pudo buscar el usuario.");

    }
}


function mostrarUsuario(usuario) {

    const contenedorTabla =
        document.getElementById("contenedorTabla");

    const cuerpoTabla =
        document.getElementById("cuerpoTabla");


    // Limpiamos datos anteriores
    cuerpoTabla.innerHTML = "";


    // Creamos una fila
    const fila = document.createElement("tr");


    // Ponemos los datos del usuario
    fila.innerHTML = `
        <td>${usuario.nombre}</td>
        <td>${usuario.apellido}</td>
        <td>${usuario.matricula}</td>
        <td>${usuario.inscripciones}</td>
        <td>${usuario.estado}</td>
        <td>${usuario.ultimoPago}</td>
    `;


    // Agregamos la fila a la tabla
    cuerpoTabla.appendChild(fila);


    // MOSTRAMOS LA TABLA
    contenedorTabla.style.display = "block";
}

    </script>

<!--    NAVBAR  -->
  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>

</body>

</html>
