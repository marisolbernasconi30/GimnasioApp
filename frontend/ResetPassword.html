<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña</title>
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/inscripciones.css">
</head>
<body>

<main class="formulario" style="max-width: 400px; margin: 80px auto;">
    <h1>Nueva contraseña</h1>
    <fieldset>
        <div class="campo">
            <label for="newPassword">NUEVA CONTRASEÑA:</label>
            <input type="password" id="newPassword">
        </div>
    </fieldset>
    <button type="button" id="btnConfirmar" class="btn-matricular">Confirmar</button>
    <p id="mensaje" style="margin-top: 12px;"></p>
</main>
<script type="module" src="js/reset-password.js"></script>
</body>
</html>
