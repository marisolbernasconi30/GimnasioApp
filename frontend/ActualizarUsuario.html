<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Actualizar Usuario</title>
  <link rel="stylesheet" href="styles.css"> <!-- tu CSS -->
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

  <main class="formulario">

       

        <br>
        <h2>Complete el formulario</h2>


        <form>
            <fieldset>
                <legend>Actualizar usuario</legend>


                    <div class="campo">
                        <label for="nombre">NOMBRE:</label>
                        <input type="text" id="nombre" name="nombre">
                    </div>
                
                
                    <div class="campo">
                        <label for="apellido">APELLIDO:</label>
                        <input type="text" id="apellido" name="apellido">
                    </div>
                
                
                     <div class="campo">
                        <label for="fecha_nacimiento">FECHA DE NACIMIENTO:</label>
                    
                        <input
                            type="date"
                            id="fecha_nacimiento"
                            name="fecha_nacimiento">
                    </div>
                
                
                    <div class="campo">
                        <label for="celular">CELULAR:</label>
                        <input type="tel" id="celular" name="celular">
                    </div>
                
                
                    <div class="campo">
                        <label for="direccion">DIRECCIÓN:</label>
                        <input type="text" id="direccion" name="direccion">
                    </div>
                
                
                    <div class="campo">
                        <label for="lesion">LESIÓN:</label>
                        <input type="text" id="lesion" name="lesion">
                    </div>
                
                
                    <div class="campo">
                        <label for="entrenamiento">ENTRENAMIENTO:</label>
                    
                        <select id="entrenamiento" name="entrenamiento">
                            <option value="">Seleccionar</option>
                            <option value="fuerza">Musculación</option>
                            <option value="cardio">Cardio</option>
                            <option value="funcional">Funcional</option>
                            <option value="crossfit">Crossfit</option>
                            <option value="yoga">Yoga</option>
                            <option value="pilates">Pilates</option>
                        </select>
                    </div>
                
                
                    <!-- CALENDARIO -->
                    <div class="campo">
                        <label for="fechaInicio">FECHA DE INICIO:</label>
                    
                        <input
                            type="date"
                            id="fechaInicio"
                            name="fechaInicio">
                    </div>
  </fieldset>
</form>

            <button type="submit" class="btn-matricular"> <!-- ver "btn-matricular"-->
                Actualizar usuario
            </button>
        
  

    </main>

  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>
</body>
</html>
