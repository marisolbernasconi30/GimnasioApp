<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Inscripción</title>
  <link rel="stylesheet" href="styles.css"> <!-- tu CSS -->
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

  <h1>Crear Inscripción</h1>
  



 <div class="item -4"> 
           <fieldset>
    
            <legend ><b>Seleccione entrenamiento deseado </b></legend>

            <table border="0">
        
            <tr>
            <td>
               <input type="radio" name="entrenamiento" > <label>Musculación</label> 
            </td>   
            <td >
             <input type="radio" name="entrenamiento" > <label>Cardio</label> 
            </td>
            <td >
             <input type="radio" name="entrenamiento" > <label>Funcional</label> 
            </td>
            <td >
             <input type="radio" name="entrenamiento" > <label>Crossfit</label> 
            </td>
            <td >
             <input type="radio" name="entrenamiento" > <label>Yoga</label> 
            </td>
            <td >
             <input type="radio" name="entrenamiento" > <label>Pilates</label> 
            </td>
            </tr>
           </table>
     
           </fieldset>  
        </div>


  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>
</body>
</html>
