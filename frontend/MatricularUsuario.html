<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matricular usuario</title>

    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/inscripciones.css">
</head>

<body>

    <!-- Aquí se inyectará el navbar -->
    <div id="navbar"></div>

    <!-- =========================
         FORMULARIO
         ========================= -->

    <main class="formulario">

        <h1>Matricular usuario</h1>

        <br>
        <h2>Complete el formulario</h2>

        <form>
            <fieldset>
                <legend>Matricular usuario</legend>

                <div class="campo">
                    <label for="nombre">NOMBRE:</label>
                    <input type="text" id="nombre" name="nombre">
                </div>

                <div class="campo">
                    <label for="apellido">APELLIDO:</label>
                    <input type="text" id="apellido" name="apellido">
                </div>

                <div class="campo">
                    <label for="fechaNacimiento">FECHA DE NACIMIENTO:</label>
                    <input type="date" id="fechaNacimiento" name="fechaNacimiento">
                </div>

                <div class="campo">
                    <label for="dni">DNI:</label>
                    <input type="text" id="dni" name="dni">
                </div>

                <div class="campo">
                    <label for="celular">CELULAR:</label>
                    <input type="tel" id="celular" name="celular">
                </div>

                <div class="campo">
                    <label for="domicilio">DIRECCIÓN:</label>
                    <input type="text" id="domicilio" name="domicilio">
                </div>

                <div class="campo">
                    <label for="lesion">LESIÓN:</label>
                    <input type="text" id="lesion" name="lesion">
                </div>

            </fieldset>
        </form>

        <button id="btnMatricular" class="btn-matricular">Matricular usuario</button>

    </main>

    <div id="toast" class="toast"></div>

    <!-- conecto con el backend y bdd -->
    <script type="module" src="js/clientes.js"></script>
    <script type="module" src="js/config.js"></script>
    <script type="module" src="js/navbar-loader.js"></script>

</body>

</html>
