<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clientes Activos</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div id="navbar"></div>

    <h1>Usuarios</h1>

    <button onclick="listarClientes()">Ver usuarios Activos</button>

    <button onclick="listarClientesInactivos()">Ver usuarios Inactivos</button>


    <table>
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>DNI</th>
                <th>Fecha Nacimiento</th>
                <th>Celular</th>
                <th>Dirección</th>
                <th>Lesión</th>
                <th>Editar</th>
            </tr>


        </thead>

        <tbody id="usuarios">

        </tbody>
    </table>

    <script src="js/clientes.js"></script>
    <script>

        // Cargar navbar
        fetch("navbar.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            })
            .catch(err => console.error("Error cargando navbar:", err));
    </script>

</body>
</html>
