<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar Inscripción</title>
  <link rel="stylesheet" href="./css/global.css"> <!-- tu CSS -->
  <link rel="stylesheet" href="./css/inscripciones.css">
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

  <h1>Cancelar Inscripción</h1>


<main class="formulario">

        <br>

        <h2>Dar de baja inscripción</h2>

        <form id="formBuscar">

            <fieldset>

                <legend>Buscar usuario</legend>

                <div class="campo">

                    <label for="dni">DNI:</label>

                    <input
                        type="text"
                        id="dni"
                        name="dni"
                    >

                </div>

                <button type="submit" class="btn-matricular">
                    Buscar usuario
                </button>

            </fieldset>

        </form>

        <!-- Datos del usuario -->
        <section id="datosUsuario" style="display: none;">

            <h3>Datos del usuario</h3>

            <p>
                <strong>Nombre:</strong>
                <span id="nombreUsuario"></span>
            </p>

            <p>
                <strong>Apellido:</strong>
                <span id="apellidoUsuario"></span>
            </p>

            <p>
                <strong>DNI:</strong>
                <span id="dniUsuario"></span>
            </p>

        </section>

        <!-- Inscripciones -->
        <section id="contenedorInscripciones" style="display: none;">

            <h3>Inscripciones</h3>

            <table>

                <thead>
                    <tr>
                        <th>Tipo</th>
                        <th>Fecha de inicio</th>
                        <th>Fecha de vencimiento</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>

                <tbody id="tablaInscripciones">
                </tbody>

            </table>

        </section>

    </main>

<script type="module" src="js/navbar-loader.js"></script>

  <script  type="module" src="./js/darDeBajaInscripcion.js"> </script>

</body>
</html>
