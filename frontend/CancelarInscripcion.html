<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cancelar Inscripción</title>
  <link rel="stylesheet" href="./css/global.css"> <!-- tu CSS -->
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

  <h1>Cancelar Inscripción</h1>


<main class="formulario">

       

        <br>
        <h2>Complete el formulario</h2>


        <form>
            <fieldset>
                <legend>Cancelar Inscripción</legend>

                    <div class="campo">
                        <label for="dni">DNI:</label>
                        <input type="text" id="dni" name="dni">
                    </div>



                
  </fieldset>
</form>

            <button type="submit" class="btn-matricular"> <!-- ver "btn-matricular"-->
                Cancelar Inscripción
            </button>
        

    </main>



  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>
</body>
</html>
