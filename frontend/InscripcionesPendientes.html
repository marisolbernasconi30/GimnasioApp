<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seguimiento de Cuotas</title>
  <link rel="stylesheet" href="./css/global.css"> <!-- tu CSS -->
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

    <h1>Inscripciones pendientes</h1>

    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Tipo de entrenamiento</th>
                <th>Fecha de inicio</th>
                <th>Fecha de baja</th>
                <th>Estado</th>
            </tr>

        </thead>

        <tbody id="tablaPendientes">

        </tbody>

    </table>


  <script type="module" src="js/inscripcionesPendientes.js"> </script>

  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>
</body>
</html>
