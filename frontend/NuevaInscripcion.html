<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva inscripción</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/inscripciones.css">

</head>


<body>

      <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

    <main class="formulario" style="max-width: 600px;">

        <h1 style="text-align: center;">Nueva inscripción</h1>


       <!-- BUSCAR CLIENTE -->
        <fieldset>
            <legend>Buscar cliente</legend>

            <div class="campo">
                <label for="dni">DNI del cliente:</label>
                <input type="text" id="dni" placeholder="Ingrese DNI">
            </div>

            <div class="barra-botones">
                <button type="button" id="btnBuscar">Buscar</button>
            </div>
        </fieldset>

    <!-- DATOS DEL CLIENTE -->

        <div id="datosCliente" style="display:none;">
            <fieldset>
                <legend>Cliente</legend>
                <p>Nombre: <span id="nombreCliente"></span></p>
                <p>Apellido: <span id="apellidoCliente"></span></p>
                <p>DNI: <span id="dniCliente"></span></p>
            </fieldset>
        </div>


    <!-- FORMULARIO -->
        <div id="formularioInscripcion" style="display:none;">
            <fieldset>
                <legend>Crear inscripción</legend>

                <div class="campo">
                    <label for="tipoEntrenamiento">Tipo de entrenamiento:</label>
                    <select id="tipoEntrenamiento">
                        <option value="">Seleccione</option>
                        <option value="MUSCULACION">Musculación</option>
                        <option value="CARDIO">Cardio</option>
                        <option value="FUNCIONAL">Funcional</option>
                        <option value="CROSSFIT">Crossfit</option>
                        <option value="YOGA">Yoga</option>
                        <option value="PILATES">Pilates</option>
                    </select>
                </div>

                <div class="campo">
                    <label for="fechaInicio">Fecha de inicio:</label>
                    <input type="date" id="fechaInicio">
                </div>

                <div class="barra-botones">
                    <button type="button" id="btnCrearInscripcion">Crear inscripción</button>
                </div>
            </fieldset>
        </div>
 </main>

    <script type="module" src="js/nuevaInscripcion.js"> </script>
    <script type="module" src="js/navbar-loader.js"></script>
    <script  type="module" src="js/config.js"></script>

</body>

</html>
