<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nueva inscripción</title>

</head>


<body>

    <h1>Nueva inscripción</h1>


    <!-- BUSCAR CLIENTE -->

    <label for="dni">
        DNI del cliente:
    </label>

    <input type="text" id="dni" placeholder="Ingrese DNI">


    <button type="button" id="btnBuscar">

        Buscar

    </button>


    <!-- DATOS DEL CLIENTE -->

    <div id="datosCliente" style="display:none;">

        <h2>Cliente</h2>

        <p>
            Nombre:
            <span id="nombreCliente"></span>
        </p>

        <p>
            Apellido:
            <span id="apellidoCliente"></span>
        </p>

        <p>
            DNI:
            <span id="dniCliente"></span>
        </p>

    </div>


    <!-- FORMULARIO -->

    <div id="formularioInscripcion" style="display:none;">

        <h2>Crear inscripción</h2>


        <label for="tipoEntrenamiento">

            Tipo de entrenamiento:

        </label>


        <select id="tipoEntrenamiento">

            <option value="">
                Seleccione
            </option>

            <option value="MUSCULACION">
                Musculación
            </option>
            <option value="CARDIO">
                Cardio
            </option>
            <option value="FUNCIONAL">
                Funcional
            </option>
            <option value="CROSSFIT">
                Crossfit
            </option>
            <option value="YOGA">
                Yoga
            </option>
            <option value="PILATES">
                Pilates
            </option>

        </select>


        <br><br>


        <label for="fechaInicio">

            Fecha de inicio:

        </label>


        <input type="date" id="fechaInicio">


        <br><br>


        <button type="button" id="btnCrearInscripcion">

            Crear inscripción

        </button>

    </div>


    <script type="module" src="js/nuevaInscripcion.js">
    </script>
    <script>
        // Cargar el navbar desde navbar.html
        fetch("navbar.html")
            .then(res => res.text())
            .then(data => {
                document.getElementById("navbar").innerHTML = data;
            })
            .catch(err => console.error("Error cargando navbar:", err));
    </script>


</body>

</html>
