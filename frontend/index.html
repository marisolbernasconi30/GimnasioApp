<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Inicio</title> 
   <link rel="stylesheet" href="style-general-sheet.css" /> 
</head>
<body>
  <div class="El_general"> 

<div class="general">

       <div class="login-form">

      <h1>Ingrese al sistema</h1>

      <div class="input-direction">

        
                   <!-- Lenguaje: HTML -->
            <form id="registro-form" action="/submit" method="post">
              <!-- Campo obligatorio -->



              <br>
              <label for="nombre">Usuario:</label>
              <input type="text" id="nombre" name="nombre" required>
              <br>
            
              <!-- Contraseña con longitud mínima -->
              <label for="password">Contraseña:</label>
              <input type="password" id="password" name="password" minlength="6" required>
            
            <br><br>
              <button type="submit">Enviar</button>
            </form>
        <br>
        </div>
        <a href="#" class="forgot">¿Olvidaste tu contraseña?</a>
      </div>
      
    </div>

  </div>
  
  </div>
</body>
</html>
