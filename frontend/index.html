<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="./css/global.css">
    <link rel="stylesheet" href="./css/inscripciones.css">
</head>

<body>

    <main class="formulario" style="max-width: 400px; margin: 80px auto;">

        <h1>Iniciar sesión</h1>

        <br>

        <fieldset>
            <legend>Credenciales</legend>

            <div class="campo">
                <label for="username">USUARIO:</label>
                <input type="text" id="username" name="username">
            </div>

            <div class="campo">
                <label for="password">CONTRASEÑA:</label>
                <input type="password" id="password" name="password">
            </div>
        </fieldset>

        <br>

        <button type="button" id="btnLogin" class="btn-matricular">Ingresar</button>

        <p id="mensajeError" style="color: #dc2626; margin-top: 12px; display: none;"></p>

    </main>

    <script type="module" src="js/login.js"></script>

</body>

</html>
