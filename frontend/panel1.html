<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página Recepcionista</title>
  <style>
    /* Estilos generales */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding-top: 60px; /* Espacio igual a la altura de la barra */
    }

    /* Barra de navegación */
    .navbar {
      display: flex;
      justify-content: center;
      background-color: #333;
      position: fixed;   /* 🔑 Esto la hace fija */
      top: 0;            /* Se pega arriba */
      left: 0;
      width: 100%;       /* Ocupa todo el ancho */
      z-index: 1000;     /* Se asegura de estar encima del contenido */
    }

    .navbar ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
    }

    .navbar li {
      position: relative;
    }

    .navbar a {
      display: block;
      padding: 14px 20px;
      color: white;
      text-decoration: none;
    }

    .navbar a:hover {
      background-color: #575757;
    }

    /* Submenús */
    .navbar ul ul {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: #444;
      min-width: 180px;
      flex-direction: column;
    }

    .navbar ul ul li a {
      padding: 10px;
    }

    .navbar li:hover > ul {
      display: flex;
    }

    /* Responsive */
    @media (max-width: 768px) {
      .navbar {
        flex-direction: column;
        align-items: flex-start;
      }
      .navbar ul {
        flex-direction: column;
        width: 100%;
      }
      .navbar li {
        width: 100%;
      }
    }

    /* Mensaje de bienvenida */
    .welcome {
      text-align: center;
      margin-top: 30px;
      font-size: 1.5em;
      color: #333;
    }
  </style>
</head>
<body>


      <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>



  <!-- Mensaje -->
  <div class="welcome">
    ¡Bienvenido, Recepcionista! 🌟
  </div>


 <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>


</body>
</html>
