<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Pago</title>
  <link rel="stylesheet" href="./css/global.css"> <!-- tu CSS -->
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

  <form>
            <fieldset>
              <legend>Nuevo Pago</legend>

                    <div class="campo">
                        <label for="dni">DNI DEL USUARIO:</label>
                        <input type="text" id="dni" name="dni">
                    </div>
            </fieldset>

 <div class="item -4"> 
           <fieldset>
    
            <legend ><b>Seleccione método de pago </b></legend>

            <table border="0">
        
            <tr>
            <td>
               <input type="radio" name="pago" > <label>Efectivo</label> 
            </td>   
            <td >
             <input type="radio" name="pago" > <label>Transferencia</label> 
            </td>
            <td >
             <input type="radio" name="pago" > <label>Tarjeta</label> 
            </td>
            <td >
             <input type="radio" name="pago" > <label>Mercado Pago</label> 
            </td>
            </tr>
           </table>
     
           </fieldset>  
        </div>

            <fieldset>
              <legend>INGRESE MONTO</legend>

                    <div class="campo">
                        <label for="monto">MONTO:</label>
                        <input type="text" id="monto" name="monto">
                    </div>
            </fieldset>
 </form>






        
  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>
</body>
</html>
