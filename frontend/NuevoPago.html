<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nuevo Pago</title>
  <link rel="stylesheet" href="styles.css"> <!-- tu CSS -->
</head>
<body>
  
  <!-- Aquí se inyectará el navbar -->
  <div id="navbar"></div>

  <h1>Nuevo Pago</h1>


  

 <div class="item -4"> 
           <fieldset>
    
            <legend ><b>Método de pago </b></legend>

            <table border="0">
        
            <tr>
            <td>
               <input type="radio" name="interes" > <label>Efectivo</label> 
            </td>   
            <td >
             <input type="radio" name="interes" > <label>Transferencia</label> 
            </td>
            <td >
             <input type="radio" name="interes" > <label>Tarjeta</label> 
            </td>
            <td >
             <input type="radio" name="interes" > <label>Mercado Pago</label> 
            </td>
            </tr>
           </table>
     
           </fieldset>  
        </div>








        
  <script>
    // Cargar el navbar desde navbar.html
    fetch("navbar.html")
      .then(res => res.text())
      .then(data => {
        document.getElementById("navbar").innerHTML = data;
      })
      .catch(err => console.error("Error cargando navbar:", err));
  </script>
</body>
</html>
